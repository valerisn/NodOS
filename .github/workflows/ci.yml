name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  check:
    name: Format, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Format
        run: zig build fmt
      - name: Build
        run: zig build --summary all
      - name: Test
        run: zig build test --summary all

  smoke:
    name: Smoke test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: zig build
      - name: Run smoke test
        run: bash scripts/smoke.sh
      - name: Build what the update test needs
        run: |
          zig build sign-tool --prefix /tmp/signtool
          zig build -Doptimize=ReleaseSafe -Dstrip=true -Dbuild-version=9.9.9 --prefix /tmp/nodos-new
          zig build -Doptimize=ReleaseSafe -Dstrip=true -Dbuild-version=9.9.10 --prefix /tmp/nodos-patch
      - name: Update end to end (signatures, attacks, rollback, unattended rules)
        # root, because replacing an installed binary needs it
        run: sudo env "PATH=$PATH" PATCH_DIR=/tmp/nodos-patch bash scripts/update_e2e.sh /tmp/nodos-new "$PWD/zig-out/bin/nodos" /tmp/signtool/bin/release-sign

  lint:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

  install:
    name: Install as a service (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the release binary
        run: zig build -Doptimize=ReleaseSafe -Dstrip=true
      - name: Install
        run: sudo bash scripts/install.sh zig-out/bin/nodos
      - name: Unit file is valid
        run: sudo systemd-analyze verify /etc/systemd/system/nodos.service
      - name: Create an admin, start the hardened service
        run: |
          printf '%s\n' 'ci install passphrase' | sudo -u nodos /usr/local/bin/nodos user add ci --config /etc/nodos/nodos.conf
          sudo systemctl start nodos
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          systemctl is-active nodos
      - name: Hardened service can still read the host and sign in
        run: |
          LOGIN=$(curl -s -i -d '{"username":"ci","password":"ci install passphrase"}' http://127.0.0.1:8080/api/v1/login)
          echo "$LOGIN" | head -1 | grep -q 200
          TOKEN=$(echo "$LOGIN" | grep -i '^set-cookie:' | sed -E 's/.*nodos_session=([^;]+).*/\1/')
          sleep 5
          curl -s -H "Cookie: nodos_session=$TOKEN" http://127.0.0.1:8080/api/v1/system | grep -Eq '"total_kb":[1-9]'
      - name: Measure the running service
        # Numbers from a shared 2 core GitHub VM: indicative, not a benchmark.
        # They go to the job summary so docs/development/performance.md can
        # quote real Linux figures instead of guesses.
        run: |
          set -u
          PID=$(systemctl show -p MainPID --value nodos)
          rss() { awk '/VmRSS/{print $2}' "/proc/$PID/status"; }
          ticks() { awk '{print $14+$15}' "/proc/$PID/stat"; }
          pctl() { sort -n | awk '{a[NR]=$1} END{printf "p50=%.2f ms  p99=%.2f ms  max=%.2f ms (n=%d)", a[int(NR*0.5)]*1000, a[int(NR*0.99)]*1000, a[NR]*1000, NR}'; }
          LOGIN=$(curl -s -i -d '{"username":"ci","password":"ci install passphrase"}' http://127.0.0.1:8080/api/v1/login)
          TOKEN=$(echo "$LOGIN" | grep -i '^set-cookie:' | sed -E 's/.*nodos_session=([^;]+).*/\1/')
          sleep 10
          IDLE_RSS=$(rss)
          T1=$(ticks); sleep 10; T2=$(ticks)
          IDLE_CPU=$(awk -v d=$((T2-T1)) 'BEGIN{printf "%.2f", d/100/10*100}')
          H=$(for _ in $(seq 1 500); do curl -s -o /dev/null -w '%{time_total}\n' http://127.0.0.1:8080/api/v1/health; done | pctl)
          S=$(for _ in $(seq 1 500); do curl -s -o /dev/null -w '%{time_total}\n' -H "Cookie: nodos_session=$TOKEN" http://127.0.0.1:8080/api/v1/system; done | pctl)
          AFTER_RSS=$(rss)
          # fill the stream cap (16) and watch memory and CPU for 10 s
          for _ in $(seq 1 16); do curl -s -N --max-time 12 -H "Cookie: nodos_session=$TOKEN" http://127.0.0.1:8080/api/v1/stream >/dev/null & done
          sleep 3
          T3=$(ticks); sleep 8; T4=$(ticks)
          STREAM_RSS=$(rss)
          STREAM_CPU=$(awk -v d=$((T4-T3)) 'BEGIN{printf "%.2f", d/100/8*100}')
          wait
          BIN=$(stat -c %s /usr/local/bin/nodos)
          {
            echo "### NodOS on a GitHub Ubuntu runner (shared VM, indicative only)"
            echo ""
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Binary size (ReleaseSafe, stripped) | $((BIN/1024)) KB |"
            echo "| Idle RSS | ${IDLE_RSS} KB |"
            echo "| Idle CPU (10 s, 2 s sampling) | ${IDLE_CPU} % of one core |"
            echo "| GET /api/v1/health, new connection each | $H |"
            echo "| GET /api/v1/system (auth), new connection each | $S |"
            echo "| RSS after 1000 requests | ${AFTER_RSS} KB |"
            echo "| RSS with 16 live streams | ${STREAM_RSS} KB |"
            echo "| CPU with 16 live streams | ${STREAM_CPU} % of one core |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Update units are valid
        run: sudo systemd-analyze verify /etc/systemd/system/nodos-update.service /etc/systemd/system/nodos-update.timer
      - name: Build the "newer" release and the signing tool
        run: |
          zig build sign-tool --prefix /tmp/signtool
          zig build -Doptimize=ReleaseSafe -Dstrip=true -Dbuild-version=9.9.9 --prefix /tmp/nodos-good
      - name: Update the installed service (rollback of a broken release, upgrade, notice, toggle)
        run: sudo bash scripts/update_service_e2e.sh /tmp/nodos-good /tmp/signtool/bin/release-sign
      - name: Stops cleanly
        run: |
          sudo systemctl stop nodos
          ! systemctl is-active --quiet nodos
          journalctl -u nodos --no-pager | tail -n 15

  cross:
    name: Cross compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build ReleaseSafe
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
