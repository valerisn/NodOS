name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Version
        id: ver
        run: |
          zon_version=$(grep -oP '\.version = "\K[^"]+' build.zig.zon)
          echo "zon=${zon_version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${zon_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match build.zig.zon version ${zon_version}" >&2
            exit 1
          fi

      - name: Test
        run: zig build test

      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.zon }}"
          mkdir dist
          for target in x86_64-linux-musl aarch64-linux-musl; do
            zig build -Dtarget=$target -Doptimize=ReleaseSafe -Dstrip=true --prefix "out/$target"
            name="nodos-v${VERSION}-${target%-musl}"
            mkdir -p "pkg/$name/scripts" "pkg/$name/packaging"
            cp "out/$target/bin/nodos" "pkg/$name/nodos"
            cp scripts/install.sh "pkg/$name/scripts/"
            cp packaging/* "pkg/$name/packaging/"
            cp LICENSE README.md CHANGELOG.md "pkg/$name/"
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Sign the checksums
        env:
          NODOS_SIGNING_KEY: ${{ secrets.NODOS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NODOS_SIGNING_KEY:-}" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "The NODOS_SIGNING_KEY secret is missing, so this release cannot be signed. Run scripts/release-keygen.sh once, commit src/update/signing.pub, then tag again." >&2
              exit 1
            fi
            echo "::warning::No signing key configured. This dry run is UNSIGNED; nodos update would refuse it."
            exit 0
          fi
          zig build sign-tool --prefix .zig-cache/sign
          TOOL=.zig-cache/sign/bin/release-sign
          "$TOOL" sign dist/SHA256SUMS > dist/SHA256SUMS.sig
          "$TOOL" verify dist/SHA256SUMS dist/SHA256SUMS.sig src/update/signing.pub
          ls -l dist

      - name: Check the x86_64 binary runs and reports its version
        run: |
          tar -xzf dist/nodos-v${{ steps.ver.outputs.zon }}-x86_64-linux.tar.gz -C /tmp
          /tmp/nodos-v${{ steps.ver.outputs.zon }}-x86_64-linux/nodos version | grep -q "${{ steps.ver.outputs.zon }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nodos-release-files
          path: dist/*

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nodos-release-files
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
