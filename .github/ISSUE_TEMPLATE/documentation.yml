name: Documentation improvement
description: Something is missing, wrong or unclear in the docs
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: docs/architecture/overview.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
